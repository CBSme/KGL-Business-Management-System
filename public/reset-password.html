<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KGL — Reset Password</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="icon" href="data:," />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        background: linear-gradient(
          135deg,
          #0d1f14 0%,
          #1a4a2a 50%,
          #0d1f14 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        background: #fff;
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }
      .logo .icon {
        width: 48px;
        height: 48px;
        background: linear-gradient(135deg, #27a85a, #f4a923);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: #fff;
      }
      .logo span {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1a2e1a;
        line-height: 1.2;
      }
      .logo small {
        color: #6b7c6b;
        font-size: 0.72rem;
      }
      h2 {
        font-size: 1.3rem;
        font-weight: 700;
        color: #1a2e1a;
        margin-bottom: 6px;
      }
      p.sub {
        color: #6b7c6b;
        font-size: 0.82rem;
        margin-bottom: 24px;
        line-height: 1.5;
      }
      label {
        font-size: 0.82rem;
        font-weight: 600;
        color: #3a4a3a;
        margin-bottom: 5px;
        display: block;
      }
      input {
        width: 100%;
        padding: 11px 14px;
        border: 1.5px solid #dde5dd;
        border-radius: 10px;
        font-family: "Poppins", sans-serif;
        font-size: 0.85rem;
        outline: none;
        transition: border-color 0.2s;
        margin-bottom: 16px;
      }
      input:focus {
        border-color: #27a85a;
      }
      .btn-main {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #1a6b3a, #27a85a);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-family: "Poppins", sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .btn-main:hover {
        opacity: 0.9;
      }
      .btn-main:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .alert {
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 0.82rem;
        margin-bottom: 16px;
      }
      .alert-success {
        background: #d4edda;
        color: #155724;
      }
      .alert-danger {
        background: #f8d7da;
        color: #721c24;
      }
      .alert-warning {
        background: #fff3cd;
        color: #856404;
      }
      .back-link {
        display: block;
        text-align: center;
        margin-top: 18px;
        font-size: 0.82rem;
        color: #6b7c6b;
        text-decoration: none;
      }
      .back-link:hover {
        color: #1a6b3a;
      }
      .spinner-border-sm {
        width: 1rem;
        height: 1rem;
        border-width: 0.15em;
      }
    </style>
  </head>
  <body>
    <div class="card" id="app">
      <div class="logo">
        <div class="icon"><i class="fas fa-seedling"></i></div>
        <div>
          <span>KGL System</span><br /><small>Karibu Groceries Ltd</small>
        </div>
      </div>

      <h2>
        <i class="fas fa-lock me-2" style="color: #27a85a"></i>Reset Password
      </h2>
      <p class="sub">Enter your new password below.</p>

      <div v-if="tokenError" class="alert alert-warning">
        <i class="fas fa-exclamation-triangle me-2"></i>This reset link is
        invalid or has expired.
        <a href="forgot-password.html">Request a new one</a>.
      </div>

      <div v-if="msg" :class="'alert alert-'+(ok?'success':'danger')">
        <i
          :class="'fas me-2 '+(ok?'fa-check-circle':'fa-exclamation-circle')"
        ></i
        >{{msg}}
      </div>

      <div v-if="!tokenError && !ok">
        <label>New Password</label>
        <input
          v-model="password"
          type="password"
          placeholder="At least 6 characters"
        />
        <label>Confirm New Password</label>
        <input
          v-model="confirm"
          type="password"
          placeholder="Repeat new password"
          @keyup.enter="submit"
        />
        <button class="btn-main" @click="submit" :disabled="loading">
          <span v-if="!loading"
            ><i class="fas fa-save me-2"></i>Save New Password</span
          >
          <span v-else
            ><span class="spinner-border spinner-border-sm me-2"></span
            >Saving...</span
          >
        </button>
      </div>

      <a
        v-if="ok"
        href="login.html"
        class="btn-main"
        style="
          display: block;
          text-align: center;
          text-decoration: none;
          margin-top: 8px;
        "
      >
        <i class="fas fa-sign-in-alt me-2"></i>Go to Login
      </a>

      <a href="login.html" class="back-link"
        ><i class="fas fa-arrow-left me-1"></i>Back to Login</a
      >
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script>
      Vue.createApp({
        data() {
          return {
            token: "",
            password: "",
            confirm: "",
            loading: false,
            msg: "",
            ok: false,
            tokenError: false,
          };
        },
        methods: {
          async submit() {
            if (!this.password || !this.confirm) {
              this.msg = "Please fill in both fields.";
              this.ok = false;
              return;
            }
            if (this.password !== this.confirm) {
              this.msg = "Passwords do not match.";
              this.ok = false;
              return;
            }
            if (this.password.length < 6) {
              this.msg = "Password must be at least 6 characters.";
              this.ok = false;
              return;
            }
            this.loading = true;
            this.msg = "";
            try {
              const r = await fetch("/api/auth/reset-password-token", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  token: this.token,
                  newPassword: this.password,
                }),
              });
              const d = await r.json();
              this.ok = r.ok;
              this.msg = d.message || d.error;
            } catch {
              this.msg = "Cannot connect to server.";
              this.ok = false;
            } finally {
              this.loading = false;
            }
          },
        },
        mounted() {
          const params = new URLSearchParams(window.location.search);
          this.token = params.get("token") || "";
          if (!this.token) this.tokenError = true;
        },
      }).mount("#app");
    </script>
  </body>
</html>
